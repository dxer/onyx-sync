<svg xmlns="http://www.w3.org/2000/svg" width="240" height="210" viewBox="0 0 240 210" role="img" aria-label="Onyx logo">
  <defs>
    <linearGradient id="onyxFacet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2b2b"/>
      <stop offset="55%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="onyxGlint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Onyx gem: elongated hexagonal cut stone -->
  <g transform="translate(120 108)">
    <polygon points="0,-88 62,-38 46,10 -46,10 -62,-38" fill="url(#onyxFacet)" stroke="#3d3d3d" stroke-width="1.5"/>
    <polygon points="0,-88 62,-38 0,-18 -62,-38" fill="url(#onyxGlint)"/>
    <polygon points="-46,10 46,10 0,96" fill="#000000" stroke="#2e2e2e" stroke-width="1.5"/>
    <polygon points="0,-64 40,-32 0,-14 -40,-32" fill="none" stroke="#4a4a4a" stroke-width="1" opacity="0.8"/>
    <line x1="-30" y1="4" x2="18" y2="-52" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  </g>
</svg>
