<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Onyx encryption pipeline">
  <defs>
    <marker id="eArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <text x="440" y="30" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111111">Onyx · Encryption Pipeline (per vault)</text>

  <!-- Passphrase -->
  <rect x="40" y="80" width="130" height="64" rx="10" fill="#ffffff" stroke="#eaeaea"/>
  <text x="105" y="107" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111111">Passphrase</text>
  <text x="105" y="125" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#666666">never uploaded</text>

  <!-- Vault salt -->
  <rect x="40" y="172" width="130" height="64" rx="10" fill="#ffffff" stroke="#eaeaea"/>
  <text x="105" y="199" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#111111">Vault Salt</text>
  <text x="105" y="217" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#666666">random · per vault</text>

  <!-- PBKDF2 (black) -->
  <rect x="220" y="118" width="130" height="84" rx="10" fill="#111111"/>
  <text x="285" y="152" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff">PBKDF2</text>
  <text x="285" y="170" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#bbbbbb">HMAC-SHA256</text>
  <text x="285" y="186" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#bbbbbb">100,000 iters</text>

  <!-- HKDF (black) -->
  <rect x="400" y="118" width="130" height="84" rx="10" fill="#111111"/>
  <text x="465" y="152" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff">HKDF</text>
  <text x="465" y="170" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#bbbbbb">sub-key</text>
  <text x="465" y="186" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#bbbbbb">derivation</text>

  <!-- AES key box -->
  <rect x="580" y="52" width="270" height="70" rx="10" fill="#ffffff" stroke="#111111"/>
  <rect x="600" y="66" width="130" height="20" rx="10" fill="#111111"/>
  <text x="665" y="80" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">AES-256-GCM</text>
  <text x="715" y="108" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#666666">file content + path encryption</text>

  <!-- HMAC key box -->
  <rect x="580" y="146" width="270" height="70" rx="10" fill="#ffffff" stroke="#111111"/>
  <rect x="600" y="160" width="130" height="20" rx="10" fill="#111111"/>
  <text x="665" y="174" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">HMAC-SHA256</text>
  <text x="715" y="202" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="10" fill="#666666">content hash · dedup</text>

  <!-- Server sees annotation -->
  <rect x="580" y="234" width="270" height="38" rx="8" fill="#fafafa" stroke="#eaeaea" stroke-dasharray="4 3"/>
  <text x="715" y="251" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-style="italic" fill="#888888">the server only sees opaque ciphertext,</text>
  <text x="715" y="265" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="9" font-style="italic" fill="#888888">encrypted paths and HMAC hashes</text>

  <!-- Arrows -->
  <path d="M170 112 C 195 112, 200 145, 217 150" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#eArr)"/>
  <path d="M170 204 C 195 204, 200 172, 217 168" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#eArr)"/>
  <path d="M350 160 H 397" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#eArr)"/>
  <path d="M530 145 C 555 128, 555 100, 577 92" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#eArr)"/>
  <path d="M530 178 C 555 195, 555 180, 577 178" stroke="#111111" stroke-width="1.6" fill="none" marker-end="url(#eArr)"/>
</svg>
