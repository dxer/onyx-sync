version: '3.8'

services:
  onyx:
    # Prebuilt multi-arch Alpine image (auto-built by CI on every push to main)
    image: ghcr.io/dxer/onyx-sync:latest
    # Or build locally from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: onyx-sync-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "8080:8080"
    stop_grace_period: 30s   # >= SHUTDOWN_TIMEOUT_MS so SIGTERM can drain cleanly
    volumes:
      - ./data:/data
    # Single-node only: rate limits, WebSocket fan-out and ticket replay cache
    # live in process memory. Never scale this service past 1 replica.
    environment:
      - PORT=8080
      - DB_PATH=/data/sync.db

      # Mode 1: Local File System (Default)
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_DIR=/data/blobs

      # Mode 2: S3 / MinIO / Cloudflare R2 (Uncomment to use)
      # - STORAGE_TYPE=s3
      # - S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
      # - S3_BUCKET=onyx-blobs
      # - S3_REGION=auto
      # - S3_ACCESS_KEY_ID=your-access-key-id
      # - S3_SECRET_ACCESS_KEY=your-secret-access-key
      # - S3_PREFIX=vaults/
