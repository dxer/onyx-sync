name = "onyx-sync"
main = "src/entry-worker.ts"
compatibility_date = "2024-09-23"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "onyx-db"
database_id = "your-d1-database-id-here"

# R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "onyx-blobs"

# Optional environment variables
[vars]
# AUTH_TOKEN = "your-optional-server-access-token"
